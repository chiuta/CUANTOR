name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/gen_docs.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: out
      - name: Copy site (keeps CNAME)
        run: |
          cd out
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME -exec rm -rf {} +
          cp -r ../src/site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync site from ${GITHUB_SHA::7}"; git push origin gh-pages; }
