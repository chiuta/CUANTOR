name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo test --workspace --release

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo build --release -p cuantor-cli -p cuantor-gui
      - shell: bash
        run: |
          mkdir dist
          for b in cuantor cuantor-gui; do
            f=target/release/$b; [ -f "$f.exe" ] && f="$f.exe"; cp "$f" dist/
          done
          cp README.md dist/
      - uses: actions/upload-artifact@v5
        with:
          name: cuantor-${{ matrix.name }}
          path: dist
