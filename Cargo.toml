[workspace]
resolver = "2"
members = ["crates/cuantor-core", "crates/cuantor-cli", "crates/cuantor-gui", "crates/cuantor-ibm"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Alexio <alexio@trom.tf>"]
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
