[package]
name = "cuantor-gui"
description = "CUANTOR: aplicație desktop (Windows, macOS, Linux)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "cuantor-gui"
path = "src/main.rs"

[dependencies]
cuantor-core = { path = "../cuantor-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cuantor-ibm = { path = "../cuantor-ibm" }
